name: time-deposit-kata

x-test-runner: &test-runner
  build:
    context: .
    target: tools
  profiles: [tests]
  volumes:
    - maven-cache:/root/.m2

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - local-deposits:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "time_deposits"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/time_deposits
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  unit-tests:
    <<: *test-runner
    command: mvn -B -ntp test

  integration-tests:
    <<: *test-runner
    command: mvn -B -ntp verify -DskipUnitTests=true
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  local-deposits:
  maven-cache:
